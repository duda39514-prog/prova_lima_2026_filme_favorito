<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Filme Favorito</title>
</head>
<body>
    <h1 class="titulo">Castelo Animado</h1>

    <section id="conteudo">
        <div class="card imagem">
            <div id="sinopse">
                <div id="sinopse2">
                    <p>Sinopse</p>
                </div>

                <div id="sinopse3">
                    <p>Quer saber do que se trata O Castelo Animado? Venha conferir!
                        Descubra a história por trás do incrível O Castelo Animado!
                    </p>
                </div>

                <button>Descobrir!!</button>
            </div>
        </div>

        <div class="card imagem2">
            <div id="trailer">
                <iframe
                    id="trailer"
                    src="https://www.youtube.com/embed/iM9pZ01J7Lc?si=uwTG2iC835dHF2bZ"
                    title="YouTube video player"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen>
                </iframe>
            </div>
        </div>
         <img src="sticker.png" alt="Sticker do filme Castelo Animado" width="300px" height="auto">
    </section>
</body>
</html>
